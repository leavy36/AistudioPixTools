<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>PocketPDF — HEIC converter, social image resizer, Smart Shrink (100% local)</title>
<meta name="description" content="Free offline image toolkit: HEIC → JPG/PNG, PNG/JPG/WebP converter, Icon & Banner resizer for YouTube/Instagram/TikTok, and Smart Shrink to compress images for email (5-10× lighter). Runs 100% in your browser." />
<meta name="theme-color" content="#ECE4D3" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<style>
  :root{
    --bg:#ECE4D3; --bg2:#F2ECDD; --panel:#F7F1E3; --panel2:#EAE1CB;
    --ink:#1A1A1A; --muted:#6F6552;
    --accent:#E89B6C; --accent2:#C97B4A; --line:#D9CFB6;
    --ok:#3F8A4C; --warn:#B57E1A; --err:#B83A2A; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","Noto Sans Arabic","Noto Sans SC","Noto Sans JP","Noto Sans KR","Noto Sans Devanagari",sans-serif;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(236,228,211,.9);backdrop-filter:blur(8px);z-index:5}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px;font-family:"Iowan Old Style","Apple Garamond",Georgia,"Times New Roman",serif;font-size:20px}
  .brand .it{font-style:italic;color:var(--accent2)}
  .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px rgba(232,155,108,.35)}
  select,button,input,textarea{font:inherit;color:var(--ink)}
  select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  main{max-width:1180px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:260px 1fr;gap:18px}
  nav.tabs{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;height:fit-content;position:sticky;top:74px}
  nav.tabs .navgroup{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);padding:10px 12px 4px;font-weight:700}
  nav.tabs button{background:transparent;border:0;text-align:left;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:10px;width:100%}
  nav.tabs button:hover{background:var(--panel2);color:var(--ink)}
  nav.tabs button.active{background:linear-gradient(135deg,rgba(232,155,108,.25),rgba(201,123,74,.12));color:var(--ink);border:1px solid var(--line)}
  section.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-height:60vh}
  h1{font-size:18px;margin:0}
  h2{font-size:18px;margin:0 0 10px;font-family:"Iowan Old Style",Georgia,serif}
  p.muted{color:var(--muted);margin:6px 0 14px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .grid{display:grid;gap:10px}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600;box-shadow:0 6px 14px rgba(201,123,74,.3)}
  .btn.secondary{background:var(--panel2);border:1px solid var(--line);box-shadow:none;color:var(--ink)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);box-shadow:none}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .drop{display:block;width:100%;border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;background:var(--bg2)}
  .drop.drag{border-color:var(--accent);color:var(--ink);background:rgba(232,155,108,.08)}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font-size:12px}
  input[type=text],input[type=number],textarea,input[type=color]{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink)}
  textarea{width:100%;min-height:100px;resize:vertical}
  .field{display:flex;flex-direction:column;gap:6px;min-width:150px}
  .field label{color:var(--muted);font-size:12px}
  canvas.preview{max-width:100%;border:1px solid var(--line);border-radius:10px;background:#fff}
  .pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
  .thumb{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
  .thumb img{max-width:100%;max-height:100%;object-fit:contain}
  .thumb .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);border:0;color:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer}
  .thumb .n{position:absolute;bottom:4px;left:6px;font-size:11px;color:#fff;background:rgba(0,0,0,.5);border-radius:6px;padding:1px 6px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1A1A1A;padding:10px 14px;border-radius:10px;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:.2s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
  .footer{color:var(--muted);text-align:center;padding:20px;font-size:12px}
  .sliderrow{display:grid;grid-template-columns:160px 1fr 50px;gap:10px;align-items:center}
  .sliderrow input[type=range]{width:100%}
  @media (max-width:820px){main{grid-template-columns:1fr}nav.tabs{position:static;flex-direction:row;overflow:auto;flex-wrap:wrap}nav.tabs .navgroup{width:100%}}
  html[dir=rtl] nav.tabs button{text-align:right}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo"></div><span>Pocket<span class="it">PDF</span></span><span class="pill">● 100% local</span></div>
  <div class="row"><select id="lang" aria-label="Language"></select></div>
</header>
<main>
  <nav class="tabs" id="tabs"></nav>
  <section class="panel" id="panel"></section>
</main>
<div class="footer" id="footer"></div>
<div class="toast" id="toast"></div>

<script src="vendor/jszip.min.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
<script src="app.js"></script>
<script src="image-resizer.js"></script>
</body>
</html>
